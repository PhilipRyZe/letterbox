<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Philips Letterbox</title>
<link rel="icon" href="Logo_PJ.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-head">
  <h1 class="wordmark">Philips Letterbox</h1>
  <nav class="filters" id="filters">
    <button class="filter is-active" data-type="">Alles</button>
    <button class="filter" data-type="film">Filme</button>
    <button class="filter" data-type="serie">Serien</button>
    <button class="filter" data-type="game">Games</button>
  </nav>
  <input class="search" id="search" type="search" placeholder="Titel suchen…" />
  <select class="sort" id="sort">
    <option value="newest">Neueste zuerst</option>
    <option value="oldest">Älteste zuerst</option>
    <option value="title-asc">Titel A–Z</option>
    <option value="title-desc">Titel Z–A</option>
    <option value="year-desc">Erscheinungsjahr (neu → alt)</option>
    <option value="year-asc">Erscheinungsjahr (alt → neu)</option>
    <option value="rating">Bewertung (Besucher-Ø)</option>
    <option value="likes">Beliebtheit (♥)</option>
  </select>
</header>

<main>
  <p class="empty-state" id="empty-state" hidden>Noch nichts hier. Der Host muss erst was eintragen.</p>
  <div class="shelf" id="shelf"></div>
</main>

<!-- Detailansicht -->
<div class="overlay" id="overlay" hidden>
  <div class="ticket" id="ticket">
    <button class="close" id="close-overlay" aria-label="Schließen">✕</button>
    <div class="ticket-body" id="ticket-body"><!-- via JS gefüllt --></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
