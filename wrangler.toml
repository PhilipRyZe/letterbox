name = "letterbox"
compatibility_date = "2026-09-01"
main = "src/index.js"

# Statische Dateien aus dem public-Ordner (Startseite, Admin-UI, CSS, JS).
[assets]
directory = "./public"
binding = "ASSETS"

# D1-Datenbank-Binding. database_id nach dem Anlegen der Datenbank
# (siehe README) hier eintragen.
[[d1_databases]]
binding = "DB"
database_name = "letterbox-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Optional: zusätzliche Absicherung der Admin-API. Wenn gesetzt, muss die
# von Cloudflare Access bestätigte E-Mail exakt hiermit übereinstimmen.
[vars]
ADMIN_EMAIL = "deine-email@example.com"
